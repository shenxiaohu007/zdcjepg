name: 直播源自动更新

on:
  schedule:
    # GitHub 的 cron 用 UTC：UTC 19:05 = 北京时间 次日 03:05
    - cron: '5 19 * * *'
  # 允许在网页上手动点按钮跑，方便首次调试
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: iptv-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 抓取并检测
        run: bash scripts/run.sh

      - name: 提交结果
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output
          if git diff --cached --quiet; then
            echo "输出无变化，跳过提交"
          else
            git commit -m "auto: 更新直播源 $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi

      - name: 保留产物（推送失败时也能下载）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iptv-output
          path: output/
          retention-days: 7
