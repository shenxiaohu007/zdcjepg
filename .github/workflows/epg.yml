name: EPG Auto Update
run-name: EPG抓取任务
on:
  # 定时：每天北京时间 04:00 执行（UTC是前一天20点）
  schedule:
    - cron: '0 20 * * *'
  # 手动点击触发
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 安装Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: |
          pip install requests beautifulsoup4

      - name: 执行EPG抓取脚本
        run: python dsm_epg.py

      - name: 提交更新文件
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add all.xml all.xml.gz
          git commit -m "🤖 自动更新EPG $(date +%Y-%m-%d)" || echo "无变更无需提交"
          git push
